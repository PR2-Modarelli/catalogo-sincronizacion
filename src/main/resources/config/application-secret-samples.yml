# ===================================================================
# Samples for required secrets to be used in development and ci using prod profile.
# ===================================================================

spring:
  datasource:
    username: ${CATALOGO_DB_USER:catalogo}
    password: ${CATALOGO_DB_PASSWORD:}

jhipster:
  security:
    authentication:
      jwt:
        base64-secret: ${CATALOGO_JWT_SECRET} 